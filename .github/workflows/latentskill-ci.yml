name: LatentSkill CPU tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pyyaml safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile
        run: python -m compileall -q gr_ktc scripts tests
      - name: Static runbook checks
        env:
          PYTHONPATH: .
        run: |
          bash -n scripts/bootstrap_androidworld.sh
          python scripts/run_androidworld_latentskill_gate.py --help >/dev/null
          python scripts/analyze_androidworld_latentskill.py --help >/dev/null
          python - <<'PY'
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('configs/latentskill_androidworld_24gb.yaml').read_text())
          assert config['latent_skill']['quality_layer'] == 24
          assert config['latent_skill']['memory_tokens'] == 4
          assert config['benchmark']['commit'] == 'e3fea3ccc69787570e282c99573298f1c3019a34'
          PY
      - name: LatentSkill tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_latent_skill.py \
            tests/test_androidworld_latentskill_protocol.py \
            tests/test_androidworld_latentskill_analysis.py
