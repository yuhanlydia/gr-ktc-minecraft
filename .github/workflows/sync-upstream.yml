name: Legacy upstream sync (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain repository ownership
        run: |
          echo "Automatic upstream mirroring is disabled."
          echo "yuhanlydia/gr-ktc-minecraft is now the writable research repository."
          echo "Historical code from Yunbo-max/gr-ktc-minecraft was synchronized at f4d0160."
          echo "Do not rsync --delete this repository from the historical upstream snapshot."
