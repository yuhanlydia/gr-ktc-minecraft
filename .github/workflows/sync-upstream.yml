name: Sync upstream and overlay Prompt Decommitment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror pinned upstream and restore Prompt Decommitment overlay
        shell: bash
        run: |
          set -euxo pipefail
          cp .sync/prompt_decommitment_patch.zip /tmp/prompt_decommitment_patch.zip
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml

          git clone https://github.com/Yunbo-max/gr-ktc-minecraft.git /tmp/upstream
          git -C /tmp/upstream checkout f69633fabf22ccd50b3dd8baed59e5a00525dd3f

          rsync -a --delete --exclude='.git' /tmp/upstream/ ./

          rm -rf /tmp/pdc
          mkdir -p /tmp/pdc
          unzip -q /tmp/prompt_decommitment_patch.zip -d /tmp/pdc
          rsync -a --exclude='gr_ktc/__init__.py' /tmp/pdc/prompt_decommitment_patch/ ./

          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml
          rm -rf .sync

          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          marker = '## Latest experiment: Prompt Decommitment'
          section = '''\n## Latest experiment: Prompt Decommitment\n\nThe active research branch is a **prompt-only, training-free MineExplorer experiment**.\nIt does not modify attention masks, KV caches, or model weights. Instead, each\nclosed-loop decision is assigned a discrete event ID and the model may explicitly\nrevoke prior thought/action commitments that have become contradicted, completed,\nor obsolete under new visual evidence.\n\nPrimary comparison: `base` vs `reflection` vs `decommit_ignore` vs `decommit`.\nThe critical mechanism control is `decommit_ignore`, which uses the same longer\nprompt and five-key JSON schema but does not persist revocations. Primary benchmark\nmetrics are official MineExplorer TSR and MSR, stratified by 1/2/3/4-hop tasks.\n\n16GB configuration: `configs/prompt_decommitment_16gb.yaml`.\nExperiment protocol: `docs/PROMPT_DECOMMITMENT_EXPERIMENT.md`.\nRunner: `scripts/run_mineexplorer_prompt_decommitment.py`.\nAnalyzer: `scripts/analyze_prompt_decommitment.py`.\n'''
          if marker not in text:
              lines = text.splitlines()
              insert_at = 1 if lines and lines[0].startswith('# ') else 0
              lines[insert_at:insert_at] = section.strip('\n').splitlines() + ['']
              path.write_text('\n'.join(lines).rstrip() + '\n')
          PY

      - name: Verify Prompt Decommitment patch
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pillow numpy
          python -m compileall -q acquisition evaluation gr_ktc scripts tests
          PYTHONPATH=. pytest -q \
            tests/test_prompt_decommitment.py \
            tests/test_local_qwen_vl_provider.py \
            tests/test_prompt_decommitment_analysis.py

      - name: Commit synchronized repository
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No synchronized changes to commit.'
            exit 0
          fi
          git commit -m 'Sync full GR-KTC code and add Prompt Decommitment [skip ci]'
          git push origin HEAD:main
